[project]
name = "frontier-backend"
version = "0.1.0"
description = "La Caja Negra: migration platform backend (modular monolith)"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "cryptography>=50.0.2",
    "deepagents==0.7.23",
    "fastapi>=0.143.0",
    "langchain-anthropic==1.7.5",
    "langchain-vercel-sandbox==0.0.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "structlog>=25",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontier"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
